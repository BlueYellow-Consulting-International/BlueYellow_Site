services:
  postgres:
    image: postgres:14
    env_file: .env
    container_name: db
    restart: unless-stopped
    ports:
      - 5432
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  flectra:
    build:
      context: .
      dockerfile: Dockerfile.flectra
    image: blueyellow-flectra
    group_add:
      - "1000"
    env_file: .env
    container_name: flectra
    restart: unless-stopped
    environment:
      HOST_UID: "${HOST_UID:-1030}"
      HOST_GID: "${HOST_GID:-100}"
      FLECTRA_AUTO_INIT: "${FLECTRA_AUTO_INIT:-1}"
      FLECTRA_DB: "${FLECTRA_DB:-flectra}"
      FLECTRA_INIT_MODULES: "${FLECTRA_INIT_MODULES:-crm,sale_management,account_accountant,project,project_todo,calendar,contacts,hr,hr_attendance,hr_contract,hr_expense,hr_recruitment,hr_skills,hr_timesheet,sale_project,sale_timesheet,mass_mailing,survey,website_event,website_hr_recruitment,website_slides,website_sale,website_partner,website_crm_partner_assign,account_payment,payment,blueyellow_client,blueyellow_consultant,blueyellow_recruitment_project,website,theme_blueyellow}"
      FLECTRA_UPGRADE_MODULES: "${FLECTRA_UPGRADE_MODULES:-}"
      FLECTRA_DEFAULT_THEME: "${FLECTRA_DEFAULT_THEME:-theme_blueyellow}"
      FLECTRA_ALLOW_AUTO_DB_RESET: "${FLECTRA_ALLOW_AUTO_DB_RESET:-0}"
      FLECTRA_FORCE_DEFAULT_THEME: "${FLECTRA_FORCE_DEFAULT_THEME:-0}"
      FLECTRA_ENSURE_HOMEPAGE: "${FLECTRA_ENSURE_HOMEPAGE:-0}"
      FLECTRA_CLEAR_ASSETS_ON_BOOT: "${FLECTRA_CLEAR_ASSETS_ON_BOOT:-0}"
      FLECTRA_PROXY_MODE: "${FLECTRA_PROXY_MODE:-0}"
      FLECTRA_WEB_BASE_URL: "${FLECTRA_WEB_BASE_URL:-}"
    ports:
      - "7073:7073"
    volumes:
      - ./flectra.conf:/etc/flectra/flectra.conf:ro
      - ./addons:/mnt/extra-addons
      - ./var/lib/flectra:/var/lib/flectra  
networks:
  default:
    name: docker_default
    external: true

