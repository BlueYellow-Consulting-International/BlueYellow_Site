services:
  postgres:
    image: postgres:14
    env_file: .env
    container_name: db
    restart: unless-stopped
    ports:
      - 5432
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  flectra:
    build:
      context: .
      dockerfile: Dockerfile.flectra
      args:
        HOST_UID: "${HOST_UID}"
        HOST_GID: "${HOST_GID}"
    image: blueyellow-flectra
    group_add:
      - "1000"
    env_file: .env
    container_name: flectra
    restart: unless-stopped
    environment:
      HOST_UID: "${HOST_UID}"
      HOST_GID: "${HOST_GID}"
      FLECTRA_AUTO_INIT: "1"
      FLECTRA_DB: "${FLECTRA_DB:-flectra}"
      FLECTRA_INIT_MODULES: "${FLECTRA_INIT_MODULES:-crm,sale_management,account_accountant,project,project_todo,calendar,contacts,hr,hr_attendance,hr_contract,hr_expense,hr_recruitment,hr_skills,mass_mailing,survey,website_event,website_hr_recruitment,website_slides,website_sale,website,theme_blueyellow}"
      FLECTRA_DEFAULT_THEME: "${FLECTRA_DEFAULT_THEME:-theme_blueyellow}"
    ports:
      - "7073:7073"
    volumes:
      - ./flectra.conf:/etc/flectra/flectra.conf:ro
      - ./addons:/mnt/extra-addons
      - ./var/lib/flectra:/var/lib/flectra  
networks:
  default:
    name: docker_default
    external: true

