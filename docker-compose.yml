services:
  db:
    image: postgres:16-alpine
    container_name: consulting-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-consulting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-consulting}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-consulting} -d ${POSTGRES_DB:-consulting}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: blueyellow-api
    container_name: consulting-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-consulting}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-consulting}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@blueyellow.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      default: {}
      proxy:
        aliases: [consulting-api]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: blueyellow-web
    container_name: consulting-web
    restart: unless-stopped
    environment:
      # BFF route handlers forward browser requests to the API server-side
      API_URL: http://api:4000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      default: {}
      proxy:
        aliases: [consulting-web]

volumes:
  db_data:
    external: true
    name: blueyellow_site_postgres_data

networks:
  proxy:
    external: true
    name: docker_default
